<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-PRO — Clientes</title>
<link id="mpro-theme-css" rel="stylesheet" href="../mpro-theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
</head>
<body>

<header class="mpro-header">
  <div class="mpro-header-bar">
    <button type="button" class="mpro-header-btn" data-menu-btn aria-label="Abrir menu"><span class="material-symbols-outlined">menu</span></button>
    <div class="mpro-header-title">Clientes</div>
    <button type="button" class="mpro-header-btn" data-action="novo-cliente" aria-label="Novo cliente"><span class="material-symbols-outlined">person_add</span></button>
  </div>
  <div style="padding:0 16px 16px">
    <div style="height:48px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;gap:12px;padding:0 12px">
      <span class="material-symbols-outlined" style="color:var(--primary-fixed)">search</span>
      <input data-role="clientes-search" placeholder="Buscar cliente, e-mail ou telefone" style="border:none;background:none;outline:none;color:#fff;font-size:15px;flex:1" />
    </div>
  </div>
</header>

<div data-role="clientes-chips" style="display:flex;gap:6px;padding:12px;overflow-x:auto;border-bottom:1px solid var(--outline-variant)"></div>

<main style="padding:0 16px 32px;max-width:680px;margin:0 auto">
  <div data-role="clientes-list" style="display:flex;flex-direction:column;gap:0;margin-top:4px">
    <div class="mpro-skel" style="height:72px;border-radius:12px;margin-bottom:8px"></div>
    <div class="mpro-skel" style="height:72px;border-radius:12px"></div>
  </div>
</main>

<div class="mpro-sheet-backdrop" data-role="clientes-sheet-backdrop"></div>
<div class="mpro-sheet" data-role="clientes-sheet">
  <div class="mpro-sheet-handle"><span></span></div>
  <div style="padding:8px 20px 0;display:flex;align-items:center;justify-content:space-between">
    <h3 style="margin:0;font:800 24px/1 var(--font-display);letter-spacing:-.01em">Novo cliente</h3>
    <button type="button" class="mpro-header-btn" data-close="1" style="color:var(--on-surface-variant)"><span class="material-symbols-outlined">close</span></button>
  </div>
  <div class="mpro-sheet-body">
    <form>
      <div style="display:flex;flex-direction:column;gap:12px;padding-top:8px">
        <div style="display:flex;flex-direction:column;gap:4px">
          <label class="mpro-field-label" for="cli-nome">Nome / razão social</label>
          <input id="cli-nome" name="nome" class="mpro-field" placeholder="Ex.: Fazenda Rio Claro" required />
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div style="display:flex;flex-direction:column;gap:4px">
            <label class="mpro-field-label" for="cli-doc">CPF / CNPJ</label>
            <input id="cli-doc" name="documento" class="mpro-field" style="font-family:var(--font-mono);font-size:14px" placeholder="00.000.000/0000-00" />
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <label class="mpro-field-label" for="cli-tel">Telefone</label>
            <input id="cli-tel" name="telefone" class="mpro-field" style="font-family:var(--font-mono);font-size:14px" placeholder="(00) 00000-0000" />
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <label class="mpro-field-label" for="cli-email">E-mail</label>
          <input id="cli-email" name="email" type="email" class="mpro-field" placeholder="contato@propriedade.com.br" />
        </div>
        <div style="display:grid;grid-template-columns:1fr 96px;gap:12px">
          <div style="display:flex;flex-direction:column;gap:4px">
            <label class="mpro-field-label" for="cli-mun">Município</label>
            <input id="cli-mun" name="municipio" class="mpro-field" placeholder="Cristalina" />
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <label class="mpro-field-label" for="cli-uf">UF</label>
            <input id="cli-uf" name="uf" maxlength="2" class="mpro-field" style="text-transform:uppercase" placeholder="GO" />
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;padding:20px 0 8px;border-top:1px solid var(--outline-variant);margin-top:16px">
        <button type="button" class="mpro-btn-secondary" data-close="1">Cancelar</button>
        <button type="submit" class="mpro-btn-primary" style="flex:1">Salvar cliente</button>
      </div>
    </form>
  </div>
</div>

<script src="../mpro-prototype.js"></script>
</body>
</html>
