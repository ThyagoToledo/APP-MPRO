<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-PRO — Nova visita</title>
<link id="mpro-theme-css" rel="stylesheet" href="../mpro-theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
</head>
<body>

<header class="mpro-header">
  <div class="mpro-header-bar">
    <button type="button" class="mpro-header-btn" data-action="visita-voltar-etapa" aria-label="Voltar"><span class="material-symbols-outlined">arrow_back</span></button>
    <div class="mpro-header-title">Nova visita</div>
    <button type="button" class="mpro-header-btn" aria-label="Ajuda"><span class="material-symbols-outlined">help</span></button>
  </div>
  <div style="padding:0 16px 12px;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--primary-fixed)">
      <span data-role="visita-progress-label">ETAPA 1 DE 2</span><span data-role="visita-progress-pct">50%</span>
    </div>
    <div style="height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden"><div data-role="visita-progress-bar" style="width:50%;height:100%;background:var(--secondary-container);transition:width .2s"></div></div>
  </div>
</header>

<main style="padding:16px;max-width:640px;margin:0 auto 96px;display:flex;flex-direction:column;gap:16px">

  <div data-step="1" style="display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <label class="mpro-field-label" for="visita-cliente">Cliente</label>
      <select id="visita-cliente" data-role="visita-cliente" class="mpro-field" style="appearance:auto"><option value="">Carregando…</option></select>
    </div>
    <div data-field style="display:flex;flex-direction:column;gap:4px">
      <label class="mpro-field-label" for="visita-unidade">Propriedade / unidade *</label>
      <input id="visita-unidade" data-role="visita-unidade" class="mpro-field" placeholder="Ex.: Pivô 2, talhão 4" />
      <span class="mpro-field-error" style="display:none"><span class="material-symbols-outlined" style="font-size:16px">error</span>Obrigatório — informe o pivô ou talhão avaliado.</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="mpro-field-label">Cultura</span>
      <div data-role="visita-cultura" style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="mpro-chip" data-chip="soja">Soja</button>
        <button type="button" class="mpro-chip" data-chip="milho">Milho</button>
        <button type="button" class="mpro-chip" data-chip="cafe">Café</button>
        <button type="button" class="mpro-chip" data-chip="tomate">Tomate</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span class="mpro-field-label">Data</span>
        <input type="date" class="mpro-field" style="font-family:var(--font-mono)" />
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span class="mpro-field-label">Hora</span>
        <input type="time" class="mpro-field" style="font-family:var(--font-mono)" />
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label class="mpro-field-label" for="visita-resp">Responsável na propriedade</label>
      <input id="visita-resp" data-role="visita-responsavel" class="mpro-field" placeholder="Nome de quem acompanhou a visita" />
    </div>
  </div>

  <div data-step="2" style="display:none;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div data-role="visita-situacao-geral" style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--outline-variant);padding-top:10px">
        <span style="font-size:15px;font-weight:600">Condição geral</span>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
          <button type="button" class="mpro-chip" data-chip="adequado" style="justify-content:center"><span class="material-symbols-outlined" style="font-size:16px">check_circle</span>Adequado</button>
          <button type="button" class="mpro-chip" data-chip="monitorar" style="justify-content:center"><span class="material-symbols-outlined" style="font-size:16px">warning</span>Monitorar</button>
          <button type="button" class="mpro-chip" data-chip="corrigir" style="justify-content:center"><span class="material-symbols-outlined" style="font-size:16px">error</span>Corrigir</button>
        </div>
      </div>
      <div data-role="visita-situacao-irrigacao" style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--outline-variant);padding-top:10px">
        <span style="font-size:15px;font-weight:600">Irrigação</span>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
          <button type="button" class="mpro-chip" data-chip="adequado" style="justify-content:center"><span class="material-symbols-outlined" style="font-size:16px">check_circle</span>Adequado</button>
          <button type="button" class="mpro-chip" data-chip="monitorar" style="justify-content:center"><span class="material-symbols-outlined" style="font-size:16px">warning</span>Monitorar</button>
          <button type="button" class="mpro-chip" data-chip="corrigir" style="justify-content:center"><span class="material-symbols-outlined" style="font-size:16px">error</span>Corrigir</button>
        </div>
      </div>
      <div data-role="visita-situacao-nutricao" style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--outline-variant);padding-top:10px">
        <span style="font-size:15px;font-weight:600">Nutrição</span>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
          <button type="button" class="mpro-chip" data-chip="adequado" style="justify-content:center"><span class="material-symbols-outlined" style="font-size:16px">check_circle</span>Adequado</button>
          <button type="button" class="mpro-chip" data-chip="monitorar" style="justify-content:center"><span class="material-symbols-outlined" style="font-size:16px">warning</span>Monitorar</button>
          <button type="button" class="mpro-chip" data-chip="corrigir" style="justify-content:center"><span class="material-symbols-outlined" style="font-size:16px">error</span>Corrigir</button>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="mpro-section-label">Medições</span>
      <div data-role="visita-medicoes" style="display:flex;flex-direction:column;gap:8px"></div>
      <button type="button" class="mpro-btn-secondary" data-action="add-medicao" style="height:48px;border-style:dashed;color:var(--secondary)">
        <span class="material-symbols-outlined" style="font-size:20px">add</span>Adicionar medição
      </button>
    </div>
  </div>

</main>

<div style="position:fixed;left:0;right:0;bottom:0;border-top:1px solid var(--outline-variant);background:var(--surface);padding:12px 16px 24px;display:flex;gap:8px;align-items:center;z-index:52;max-width:640px;margin:0 auto">
  <button type="button" class="mpro-btn-secondary" data-action="visita-salvar-rascunho" style="color:var(--secondary);border:none">
    <span class="material-symbols-outlined" style="font-size:20px">save</span>Salvar rascunho
  </button>
  <button type="button" class="mpro-btn-primary" data-action="visita-avancar" style="flex:1">Avançar<span class="material-symbols-outlined" style="font-size:22px">arrow_forward</span></button>
</div>

<script src="../mpro-prototype.js"></script>
</body>
</html>
