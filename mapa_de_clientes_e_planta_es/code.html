<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-PRO — Mapa</title>
<link id="mpro-theme-css" rel="stylesheet" href="../mpro-theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<style>html,body{height:100%}body{margin:0;display:flex;flex-direction:column}</style>
</head>
<body>

<header class="mpro-header">
  <div class="mpro-header-bar">
    <button type="button" class="mpro-header-btn" data-menu-btn aria-label="Abrir menu"><span class="material-symbols-outlined">menu</span></button>
    <div class="mpro-header-title">Mapa</div>
    <button type="button" class="mpro-header-btn" aria-label="Buscar"><span class="material-symbols-outlined">search</span></button>
  </div>
</header>

<main data-role="mapa-canvas" style="flex:1;position:relative;background:var(--map-a);overflow:hidden;min-height:0">
  <div style="position:absolute;inset:0;background:linear-gradient(0deg,transparent 49.6%,var(--map-b) 49.6%,var(--map-b) 50.4%,transparent 50.4%);background-size:100% 64px;opacity:.7"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.6%,var(--map-b) 49.6%,var(--map-b) 50.4%,transparent 50.4%);background-size:64px 100%;opacity:.7"></div>
  <div style="position:absolute;left:0;right:0;top:38%;height:14%;background:var(--map-b);transform:skewY(-6deg);opacity:.9"></div>

  <div style="position:absolute;left:16px;top:16px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--on-surface-variant);background:var(--surface);border:1px solid var(--outline-variant);border-radius:4px;padding:4px 8px;z-index:2">
    <span data-role="mapa-count">carregando…</span>
  </div>
  <div style="position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:8px;z-index:2">
    <div style="width:48px;height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--outline-variant);display:flex;align-items:center;justify-content:center"><span class="material-symbols-outlined" style="color:var(--primary)">my_location</span></div>
    <div style="width:48px;height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--outline-variant);display:flex;align-items:center;justify-content:center"><span class="material-symbols-outlined" style="color:var(--primary)">layers</span></div>
  </div>
</main>

<div class="mpro-sheet-backdrop" data-role="mapa-sheet-backdrop"></div>
<div class="mpro-sheet" data-role="mapa-sheet"></div>

<script src="../mpro-prototype.js"></script>
</body>
</html>
