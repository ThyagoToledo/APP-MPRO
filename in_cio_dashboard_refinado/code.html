<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-PRO — Início</title>
<link id="mpro-theme-css" rel="stylesheet" href="../mpro-theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
</head>
<body>

<header class="mpro-header">
  <div class="mpro-header-bar">
    <button type="button" class="mpro-header-btn" data-menu-btn aria-label="Abrir menu"><span class="material-symbols-outlined">menu</span></button>
    <div class="mpro-header-title">M-PRO</div>
    <button type="button" class="mpro-header-btn" aria-label="Notificações" style="position:relative">
      <span class="material-symbols-outlined">notifications</span>
      <span style="position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--monitorar);border:2px solid var(--primary)"></span>
    </button>
  </div>
</header>

<main style="padding:20px 16px 32px;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px">

  <div style="display:flex;flex-direction:column;gap:4px">
    <span data-role="dashboard-date" style="font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;color:var(--on-surface-variant);text-transform:uppercase">carregando…</span>
    <h1 data-role="dashboard-greeting" style="margin:0;font:800 30px/1.05 var(--font-display);letter-spacing:-.02em">Olá</h1>
  </div>

  <div class="cursor-pointer" role="button" tabindex="0" style="background:var(--primary);border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;color:#fff">
    <div style="width:48px;height:48px;border-radius:12px;background:var(--secondary);display:flex;align-items:center;justify-content:center;flex:none"><span class="material-symbols-outlined" style="font-size:28px;color:#fff">add</span></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:2px">
      <span style="font:700 19px/1.1 var(--font-display)">Nova visita</span>
      <span style="font-size:13px;color:var(--primary-fixed)">Iniciar relatório técnico em campo</span>
    </div>
    <span class="material-symbols-outlined" style="color:var(--primary-fixed)">arrow_forward</span>
  </div>

  <section style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span class="mpro-section-label">Rascunhos ativos</span>
      <span data-role="dashboard-draft-badge" style="display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--monitorar);border:1px solid var(--monitorar);border-radius:999px;padding:3px 8px">…</span>
    </div>
    <div data-role="dashboard-drafts" style="display:flex;flex-direction:column;gap:0">
      <div class="mpro-skel" style="height:56px;border-radius:12px"></div>
    </div>
  </section>

  <div class="mpro-stats-row" data-role="dashboard-stats">
    <div class="mpro-stat"><span class="mpro-skel" style="width:36px;height:36px;display:block"></span></div>
    <div class="mpro-stat"><span class="mpro-skel" style="width:36px;height:36px;display:block"></span></div>
    <div class="mpro-stat"><span class="mpro-skel" style="width:36px;height:36px;display:block"></span></div>
  </div>

  <section style="display:flex;flex-direction:column;gap:8px">
    <span class="mpro-section-label">Visitas recentes</span>
    <div data-role="dashboard-recent" style="display:flex;flex-direction:column;gap:0">
      <div class="mpro-skel" style="height:56px;border-radius:12px"></div>
    </div>
  </section>

</main>

<script src="../mpro-prototype.js"></script>
</body>
</html>
